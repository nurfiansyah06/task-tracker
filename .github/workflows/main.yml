name: production

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./.
      - name: Build
        run: go build -o main
