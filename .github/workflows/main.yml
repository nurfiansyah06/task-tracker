name: production

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: 
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./.
      - name: Build
        run: go build -o main
      - name: Build Successful
        run: echo "Build Successful!"
